<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Gauge Chart</title>
      <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
      <style>
         .chart-container {
            width: 300px;
            margin: 50px auto;
            position: relative;
            font-family: sans-serif;
         }
         .percentage-label {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            font-weight: bold;
            color: #4a4a4a;
         }
         .scale-labels {
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            color: #666;
            font-size: 18px;
            margin-top: -10px;
         }
      </style>
   </head>
   <body>
      <div style="width: 100%; max-width: 800px; margin: auto">
         <canvas id="areaChart"></canvas>
      </div>
      <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

      <script>
         const ctx = document.getElementById('areaChart').getContext('2d');

         // 1. Create a gradient for the fill
         const gradient = ctx.createLinearGradient(0, 0, 0, 400);
         gradient.addColorStop(0, 'rgba(152, 208, 69, 0.6)'); // Top color (Lime)
         gradient.addColorStop(1, 'rgba(152, 208, 69, 0)'); // Bottom color (Transparent)

         new Chart(ctx, {
            type: 'line',
            data: {
               labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4', 'Week 5', 'Week 6', 'Week 7'],
               datasets: [
                  {
                     label: 'Activity',
                     data: [1500, 3600, 2200, 1800, 3100, 2800, 1800, 1400],
                     borderColor: '#76a032', // Darker green for the line
                     borderWidth: 3,
                     fill: true, // Enable area fill
                     backgroundColor: gradient,
                     tension: 0.4, // This creates the smooth "S" curves
                     pointRadius: 0, // Hide points by default
                     pointHitRadius: 10
                  }
               ]
            },
            options: {
               plugins: {
                  legend: { display: false }
               },
               scales: {
                  y: {
                     beginAtZero: true,
                     max: 4000,
                     ticks: {
                        stepSize: 1000,
                        callback: value => (value === 0 ? 0 : value / 1000 + 'k')
                     },
                     grid: {
                        display: false // Hide horizontal grid lines
                     }
                  },
                  x: {
                     grid: {
                        display: true,
                        color: '#ddd',
                        borderDash: [5, 5], // This creates the "dotted" vertical lines
                        drawTicks: false
                     },
                     ticks: {
                        padding: 20,
                        color: '#999'
                     }
                  }
               }
            }
         });
      </script>
   </body>
</html>
